name: Reviewed offline parity verification (hosted execution unverified)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity-gates:
    # Human decision: "Verification-only CI (Recommended)".
    # Provisioning is an external prerequisite, never performed by this job.
    runs-on: [self-hosted, linux, jev-reviewed-offline-runtime]
    steps:
      - name: Require exact clean checkout and reviewed offline inputs
        shell: /bin/bash --noprofile --norc {0}
        run: |
          set -euo pipefail
          fail() { printf 'Missing, stale or unreviewed CI prerequisite: %s\n' "$*" >&2; exit 1; }
          cd -- "$GITHUB_WORKSPACE"
          git_read() { /usr/bin/env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git --no-optional-locks -c core.fsmonitor=false -c core.hooksPath=/dev/null "$@"; }
          [[ "$(pwd -P)" == "$(git_read rev-parse --show-toplevel)" ]] || fail 'workspace is not the checkout root'
          checkout=$(git_read rev-parse --verify HEAD)
          [[ "$checkout" == "$GITHUB_SHA" ]] || fail 'checkout differs from dispatch commit'
          dirty=$(git_read status --porcelain --untracked-files=all)
          [[ -z "$dirty" ]] || fail 'dirty checkout'
          ignored_files=$(git_read ls-files --others --ignored --exclude-standard)
          if [[ -n "$ignored_files" ]]; then
            while IFS= read -r ignored; do
              case "$ignored" in node_modules/*) ;; *) fail "unexpected ignored input: $ignored" ;; esac
            done <<< "$ignored_files"
          fi
          attestation=/tmp/jev-reviewed-ci-inputs
          [[ -d "$attestation" && ! -L "$attestation" ]] || fail 'reviewed external attestation directory'
          [[ -f "$attestation/checkout.sha" && ! -L "$attestation/checkout.sha" ]] || fail 'checkout attestation'
          [[ "$(<"$attestation/checkout.sha")" == "$GITHUB_SHA" ]] || fail 'stale checkout attestation'
          [[ -f "$attestation/inputs.sha256" && ! -L "$attestation/inputs.sha256" ]] || fail 'frozen-lock input attestation'
          pi=/tmp/jev-native-sync.JqrUv0/pi
          tintin=/tmp/jev-native-sync.JqrUv0/tintin
          runtime=/tmp/jev-patched-runtime-uqtQjr
          roots=("$pi/node_modules" "$tintin/node_modules" "$runtime")
          inputs=(bun.lock package.json scripts/verify-sandbox.sh /usr/lib/node_modules/npm/bin/npm-cli.js
            node_modules/@earendil-works/pi-coding-agent/package.json
            node_modules/@tintinweb/pi-subagents/package.json
            node_modules/typescript/package.json node_modules/@types/bun/package.json
            "$runtime/package.json" "$runtime/src/index.ts" "$runtime/src/agent-manager.ts"
            "$pi/packages/coding-agent/dist/core/agent-session.js")
          for package in agent ai coding-agent tui telemetry chord codemode mcp; do
            roots+=("$pi/packages/$package")
            inputs+=("$pi/packages/$package/package.json")
          done
          for root in "${roots[@]}"; do
            [[ -d "$root" && ! -L "$root" ]] || fail "$root"
          done
          for binary in /usr/bin/bwrap /usr/bin/python3 /usr/bin/strace /home/dle/.bun/bin/bun /home/dle/.nvm/versions/node/v24.11.1/bin/node; do
            [[ -x "$binary" ]] || fail "$binary"
            inputs+=("$binary")
          done
          for file in "${inputs[@]}"; do
            [[ -f "$file" ]] || fail "$file"
          done
          # Exact ordered selected-file digest comparison, NOT whole dependency integrity.
          # Trusted operator creates this manifest out-of-band after frozen-lock review.
          actual=$(/usr/bin/sha256sum -- "${inputs[@]}")
          [[ "$actual" == "$(<"$attestation/inputs.sha256")" ]] || fail 'stale reviewed selected inputs'
          printf 'Verified dispatch checkout %s; external frozen-lock provisioning attested, not performed.\n' "$checkout"
      - name: Baseline reference default typecheck isolation and real offline pack
        shell: /bin/bash --noprofile --norc {0}
        run: |
          /usr/bin/env -i PATH=/usr/bin:/bin /bin/bash --noprofile --norc scripts/verify-sandbox.sh /bin/sh -c 'set -eu; for mode in baseline reference test typecheck isolation extension parity; do /bin/sh /workspace/scripts/isolated.sh "$mode" > "/evidence/ci-$mode.log" 2>&1; done'
      - name: Published unsupported assertion and reviewed patched native acceptance
        shell: /bin/bash --noprofile --norc {0}
        run: |
          /usr/bin/env -i PATH=/usr/bin:/bin JEV_SANDBOX_NATIVE=1 /bin/bash --noprofile --norc scripts/verify-sandbox.sh /bin/sh -c 'set -eu; /bin/sh /workspace/scripts/isolated.sh native-gates /workspace/test/integration/child-observer.test.ts /workspace/test/integration/child-control.test.ts /workspace/test/integration/extension.test.ts /workspace/test/integration/parity-native.test.ts > /evidence/ci-native.log 2>&1; /bin/sh /workspace/scripts/isolated.sh integration > /evidence/ci-integration.log 2>&1; /bin/sh /workspace/scripts/isolated.sh patched > /evidence/ci-patched.log 2>&1'
